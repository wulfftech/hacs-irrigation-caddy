set_program:
  name: Set program schedule
  description: >-
    Create or update a watering program's schedule on the Irrigation Caddy.
    Any field that is omitted keeps its current value on the device.
  fields:
    program:
      name: Program
      description: The program number to edit (1-3).
      required: true
      example: 1
      selector:
        number:
          min: 1
          max: 3
          mode: box
    enabled:
      name: Enabled
      description: Whether the program is allowed to run on its schedule.
      selector:
        boolean:
    days:
      name: Days to run
      description: Days of the week the program should water. Omit to keep current days.
      example: '["mon", "wed", "fri"]'
      selector:
        object:
    start_times:
      name: Start times
      description: >-
        Up to 5 start times in 24-hour HH:MM format, e.g. "06:00", "18:30".
        Omit to keep current start times.
      example: '["06:00"]'
      selector:
        object:
    zone_durations:
      name: Zone durations
      description: >-
        Map of zone number to run duration in minutes, e.g. {"1": 10, "3": 15}.
        Zones not listed are set to 0 (skipped). Omit to keep current durations.
      example: '{"1": 10}'
      selector:
        object:
